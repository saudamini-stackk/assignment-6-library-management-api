openapi: 3.0.3
info:
  title: Library Management REST API
  version: 1.0.0
  description: >-
    Complete Library Management API built with Node.js, Express, JWT, Firebase Firestore,
    Role-Based Access Control (Student & Librarian), Rate Limiting, and Swagger Documentation.
  contact:
    name: Raj Rasal
    email: raj.rasal@example.com

servers:
  - url: https://librarymanagementapi-syeu.onrender.com
    description: Production Server (Render)
  - url: http://localhost:5003
    description: Local Development Server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your JWT token in the format "Bearer <token>"

  schemas:
    User:
      type: object
      properties:
        userId:
          type: string
          example: usr_123456
        name:
          type: string
          example: Raj Rasal
        email:
          type: string
          example: student@library.com
        role:
          type: string
          enum: [student, librarian]
          example: student
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Book:
      type: object
      properties:
        bookId:
          type: string
          example: bk_987654
        title:
          type: string
          example: Clean Code
        author:
          type: string
          example: Robert C. Martin
        isbn:
          type: string
          example: 978-0132350884
        category:
          type: string
          example: Software Engineering
        status:
          type: string
          enum: [available, borrowed]
          example: available
        quantity:
          type: integer
          example: 5
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Transaction:
      type: object
      properties:
        transactionId:
          type: string
          example: tx_554433
        userId:
          type: string
          example: usr_123456
        bookId:
          type: string
          example: bk_987654
        type:
          type: string
          enum: [borrow, return]
          example: borrow
        borrowDate:
          type: string
          format: date-time
        returnDate:
          type: string
          format: date-time
          nullable: true
        dueDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, returned, overdue]
          example: active

paths:
  /api/auth/register:
    post:
      summary: Register a new user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  example: Raj Rasal
                email:
                  type: string
                  example: raj@example.com
                password:
                  type: string
                  example: Password@123
                role:
                  type: string
                  enum: [student, librarian]
                  example: student
      responses:
        201:
          description: User registered successfully
        400:
          description: Validation error or user already exists

  /api/auth/login:
    post:
      summary: Login user & get JWT token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: admin@library.com
                password:
                  type: string
                  example: Admin@123
      responses:
        200:
          description: Login successful
        401:
          description: Invalid credentials

  /api/auth/profile:
    get:
      summary: Get logged-in user profile
      tags: [Authentication]
      security:
        - BearerAuth: []
      responses:
        200:
          description: Profile retrieved successfully
        401:
          description: Unauthorized
    put:
      summary: Update user profile
      tags: [Authentication]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Rajendra Rasal
      responses:
        200:
          description: Profile updated successfully
        401:
          description: Unauthorized

  /api/books:
    get:
      summary: Get all books (with optional filters)
      tags: [Books]
      parameters:
        - in: query
          name: category
          schema:
            type: string
          description: Filter books by category
        - in: query
          name: status
          schema:
            type: string
            enum: [available, borrowed]
          description: Filter books by availability status
        - in: query
          name: author
          schema:
            type: string
          description: Filter books by author name
      responses:
        200:
          description: List of books retrieved
    post:
      summary: Add new book (Librarian only)
      tags: [Books]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, author, isbn, category, quantity]
              properties:
                title:
                  type: string
                  example: JavaScript The Good Parts
                author:
                  type: string
                  example: Douglas Crockford
                isbn:
                  type: string
                  example: 978-0596517748
                category:
                  type: string
                  example: Programming
                quantity:
                  type: integer
                  example: 3
      responses:
        201:
          description: Book added successfully
        403:
          description: Forbidden (Librarian only)

  /api/books/search:
    get:
      summary: Search books by title or author
      tags: [Books]
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
          description: Search term matching title, author, category, or ISBN
      responses:
        200:
          description: Search results matching query

  /api/books/{id}:
    get:
      summary: Get single book details
      tags: [Books]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Book details retrieved
        404:
          description: Book not found
    put:
      summary: Update book (Librarian only)
      tags: [Books]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                author:
                  type: string
                isbn:
                  type: string
                category:
                  type: string
                quantity:
                  type: integer
                status:
                  type: string
                  enum: [available, borrowed]
      responses:
        200:
          description: Book updated successfully
        403:
          description: Forbidden
        404:
          description: Book not found
    delete:
      summary: Delete book (Librarian only)
      tags: [Books]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Book deleted successfully
        403:
          description: Forbidden
        404:
          description: Book not found

  /api/books/{id}/borrow:
    post:
      summary: Borrow a book (Student only)
      tags: [Borrow & Return]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Book borrowed successfully
        400:
          description: Book out of stock or already borrowed
        403:
          description: Forbidden (Student only)

  /api/books/{id}/return:
    post:
      summary: Return a borrowed book (Student only)
      tags: [Borrow & Return]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Book returned successfully
        400:
          description: No active borrow found for user
        403:
          description: Forbidden (Student only)

  /api/transactions:
    get:
      summary: Get all transactions (Librarian only)
      tags: [Transactions]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [active, returned, overdue]
        - in: query
          name: type
          schema:
            type: string
            enum: [borrow, return]
      responses:
        200:
          description: Transactions retrieved successfully
        403:
          description: Forbidden (Librarian only)

  /api/transactions/my:
    get:
      summary: Get logged-in user's transaction history
      tags: [Transactions]
      security:
        - BearerAuth: []
      responses:
        200:
          description: User transactions retrieved successfully

  /api/users:
    get:
      summary: Get all users (Librarian only)
      tags: [User Management]
      security:
        - BearerAuth: []
      responses:
        200:
          description: List of users retrieved
        403:
          description: Forbidden

  /api/users/{id}:
    get:
      summary: Get user details (Librarian only)
      tags: [User Management]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: User retrieved
        404:
          description: User not found

  /api/users/{id}/role:
    put:
      summary: Update user role (Librarian only)
      tags: [User Management]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [student, librarian]
                  example: librarian
      responses:
        200:
          description: User role updated
        403:
          description: Forbidden

  /api/users/{id}:
    delete:
      summary: Delete user (Librarian only)
      tags: [User Management]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: User deleted
        400:
          description: Cannot delete own account
        403:
          description: Forbidden
